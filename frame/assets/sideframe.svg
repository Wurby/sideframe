<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Sideframe: a frame (the headset's view) with the Mac's screen docked at its side. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22304d"/><stop offset="1" stop-color="#0a1020"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#46e6c8"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="448" rx="200" fill="url(#shine)"/>
  <!-- the frame -->
  <rect x="176" y="296" width="672" height="432" rx="92" fill="none" stroke="#e8eef8" stroke-width="44"/>
  <!-- the Mac screen, docked at the right side -->
  <rect x="462" y="340" width="342" height="344" rx="48" fill="url(#panel)"/>
  <rect x="504" y="392" width="156" height="28" rx="14" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="504" y="444" width="244" height="22" rx="11" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="504" y="486" width="204" height="22" rx="11" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="504" y="568" width="244" height="84" rx="24" fill="#ffffff" fill-opacity="0.26"/>
</svg>
