name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/package-mac.sh
      - uses: actions/upload-artifact@v4
        with: { name: sideframe-mac, path: dist/sideframe-mac-* }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: 'dist/sideframe-mac-*' }
  # The Frame package is built on a Steam Frame itself (./scripts/package-frame.sh) so it matches SteamOS's libraries, then attached to the release.
